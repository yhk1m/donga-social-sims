마크·그린란드 대륙붕 제출 보도, 2014. 12."},hans:{org:"AP 통신(Anchorage Daily News 게재) · 캐나다 백과사전 「Hans Island」",date:"2022. 6. 14. 서명 보도 · 2023. 12. 19. 덴마크 의회 비준"},noru:{org:"노르웨이·러시아 바렌츠해·북극해 해양 경계 조약",date:"2010. 9. 15. 서명, 2011. 7. 7. 발효"},usru:{org:"미국·소련 해양 경계 협정",date:"1990. 6. 1. 서명(러시아 의회는 비준하지 않았으나 양국이 지키고 있음)"},svalbard:{org:"스발바르 조약",date:"1920. 2. 9. 서명, 1925 발효 · 대한민국 2012년 9월 가입(한국해사법학회 논문)"},arktika:{org:"BBC News",date:"「Russia plants flag under N Pole」, 2007. 8. 2."},ilulissat:{org:"일루리사트 선언(북극해 연안 5개국)",date:"2008. 5. 28."},caofa:{org:"캐나다 수산해양부(DFO) — 중앙 북극해 공해 비규제 어업 방지 협정",date:"2018. 10. 3. 서명, 2021. 6. 25. 발효"},kopri:{org:"극지연구소(KOPRI)",date:"북극 다산 과학 기지 소개 · 2014 북극 활동 보고서"},mrEez:{org:"Flanders Marine Institute, Marine Regions",date:"「Maritime Boundaries Geodatabase: EEZ」 v12, 2023 (지도 경계)"},mrEcs:{org:"Flanders Marine Institute, Marine Regions",date:"「Extended Continental Shelves」 v2, 2024, doi:10.14284/697 (지도 경계)"},ne:{org:"Natural Earth",date:"1:5천만 국가 경계 자료 (육지)"}},m1=[{term:"200해리 배타적 경제 수역",text:"해안에서 200해리(약 370km)까지의 바다. 연안국이 그 안의 물고기·석유·천연가스 등을 쓸 권리를 가진다.",src:["unclos"]},{term:"대륙붕 연장 주장",text:"바다 밑 땅(대륙붕)이 육지에서 자연스럽게 이어져 있으면, 연안국은 200해리 밖의 해저까지 자원을 쓸 권리를 주장할 수 있다. 이때 과학 자료를 유엔 대륙붕한계위원회에 내야 한다.",src:["unclos","clcs"]},{term:"위원회 권고와 경계",text:"위원회는 대륙붕의 바깥 한계에 대해 권고만 한다. 여러 나라의 주장이 겹치는 곳의 경계는 당사국끼리 협상해서 정해야 한다(제76조 제10항).",src:["unclos","ibru"]},{term:"바닷물은 공해",text:"200해리 밖 대륙붕에 대한 권리는 바다 밑 땅과 그 안의 자원에만 해당한다. 그 위의 바닷물은 여전히 공해이다.",src:["unclos"]}],b1={ru:[{text:"해저 산줄기인 로모노소프 해령과 멘델레예프-알파 해령이 시베리아 대륙붕이 이어진 것이라고 주장한다.",src:["clcsRus","belfer"]},{text:"북극해 연안을 따라가는 북동 항로(북극해 항로)를 쓰면 부산~로테르담 운항 거리가 약 22,000km에서 15,000km로 줄어든다.",src:["text113"]},{text:"북극권의 미발견 천연가스가 가장 많을 것으로 추정되는 곳은 서시베리아 분지와 동바렌츠 분지로, 모두 러시아 쪽 바다·육지에 있다.",src:["usgs"]}],dk:[{text:"로모노소프 해령이 「그린란드 북쪽 대륙 주변부의 일부」라고 주장하며 북극점을 포함한 약 89만 5천 km²를 제출하였다.",src:["sciNordic","clcs"]},{text:"그린란드 주변에는 동그린란드 열곡 분지 등 석유가 많을 것으로 추정되는 곳이 있다.",src:["usgs"]}],ca:[{text:"북극점 주변의 해저 고원(로모노소프 해령·알파 해령 등)이 캐나다 북극 제도의 대륙붕이 이어진 것이라고 주장한다.",src:["clcs","barentsCa","ibru"]},{text:"보퍼트해에서는 1825년 조약의 서경 141° 선이 바다 경계까지 이어진다고 주장한다.",src:["hnn"]}],us:[{text:"2023년 알래스카 북쪽 약 52만 km²의 해저를 자국 대륙붕이라고 발표하였다. 유엔 해양법 협약에 가입하지 않았지만 협약 내용이 국제 관습법을 반영한다고 본다.",src:["usdos","hnn"]},{text:"북극권에서 미발견 석유가 가장 많을 것으로 추정되는 곳이 알래스카 북쪽(약 300억 배럴)이다.",src:["usgs"]}],no:[{text:"2006년 대륙붕 자료를 제출해 2009년 위원회 권고를 받았다.",src:["clcs"]},{text:"바렌츠해의 수산 자원과 천연가스(동바렌츠 분지·바렌츠 대지)가 중요하다. 러시아와의 바다 경계는 2010년 조약으로 정하였다.",src:["usgs","noru"]}]},R=[{id:"ov-ca-gl-ru",kind:"ov",owners:["ru","dk","ca"],name:"북극점 둘레: 러시아·덴마크·캐나다가 함께 주장",lead:"북극점과 로모노소프 해령의 가운데 부분을 세 나라가 모두 자기 대륙붕이라고 주장하는 곳이다.",facts:[{h:"러시아의 주장",text:"로모노소프 해령은 시베리아 대륙붕이 바다 밑으로 이어진 것이라고 주장한다. 2015. 8. 3. 수정 자료를 내고, 2021. 3. 31. 범위를 넓힌 보충 자료 2건을 더 냈다.",src:["clcs","clcsRus"]},{h:"덴마크의 주장",text:"로모노소프 해령은 그린란드 대륙 주변부의 일부라고 주장한다. 2014. 12. 15. 북극점을 포함하는 범위를 제출하였다.",src:["clcs","sciNordic"]},{h:"캐나다의 주장",text:"이 해저 고원이 캐나다 북극 제도에서 이어진다고 주장한다. 2019. 5. 23. 제출하고, 2022. 12. 추가 제출로 범위를 넓혔다.",src:["clcs","ibru"]},{h:"겹치는 넓이",text:"캐나다의 추가 제출 뒤 세 나라가 함께 주장하는 곳은 약 74만 7천 km²가 되었다.",src:["ibru"]},{h:"위원회 권고",text:"2023. 2. 6. 위원회는 로모노소프 해령 등이 러시아 대륙붕의 자연 연장이라는 권고를 냈다. 하지만 이 권고가 나라 사이의 경계를 정해 주지는 않으며, 덴마크·캐나다 제출에 대한 권고는 아직 나오지 않았다.",src:["clcs","belfer","unclos"]},{h:"상징적 사건",text:"2007년 8월 러시아 탐사대가 북극점 바다 밑바닥에 러시아 국기를 꽂았다.",src:["arktika"]},{h:"자원 추정",text:"이 아래 로모노소프-마카로프 지역의 미발견 자원은 석유 약 11억 배럴, 천연가스 약 7.2조 세제곱피트로, 연안 대륙붕 지역보다 훨씬 적게 추정되었다.",src:["usgs"]}]},{id:"ov-gl-ru",kind:"ov",owners:["ru","dk"],name:"러시아·덴마크 분쟁 지역",lead:"교과서 지도의 「러시아·덴마크 분쟁 지역」에 해당한다. 로모노소프 해령의 유라시아 쪽(아문센 분지 쪽) 해저이다.",facts:[{h:"러시아의 주장",text:"2021년 보충 자료로 가켈 해령, 난센·아문센 분지까지 범위를 넓혀 덴마크 주장과 더 많이 겹치게 되었다.",src:["clcsRus"]},{h:"덴마크의 주장",text:"그린란드 대륙붕이 러시아 200해리 경계선까지 이어진다고 주장한다.",src:["sciNordic"]},{h:"위원회 권고",text:"위원회는 2023년 가켈 해령이 대륙의 일부라는 러시아의 근거가 부족하다고 보았다.",src:["belfer"]},{h:"자원 추정",text:"유라시아 분지의 미발견 자원은 석유 약 13억 배럴, 천연가스 약 19.5조 세제곱피트로 추정되었다.",src:["usgs"]}]},{id:"ov-ca-ru",kind:"ov",owners:["ru","ca"],name:"러시아·캐나다 분쟁 지역",lead:"교과서 지도의 「러시아·캐나다 분쟁 지역」에 해당한다. 멘델레예프-알파 해령 둘레의 해저이다.",facts:[{h:"러시아의 주장",text:"멘델레예프-알파 해령과 포드보드니코프 분지가 러시아 대륙붕의 자연 연장이라고 주장한다. 위원회는 2023년 이 주장을 받아들이는 권고를 냈다.",src:["belfer"]},{h:"캐나다의 주장",text:"알파 해령이 캐나다 쪽 대륙붕에서 이어진다고 주장한다. 2022년 추가 제출로 러시아와 겹치는 곳이 늘었고, 캐나다는 러시아와 정기적으로 협의하고 있다고 밝혔다.",src:["barentsCa","ibru"]},{h:"넓이",text:"지도 자료로 계산한 이 구역의 넓이는 약 68만 km²이다.",src:["mrEcs"]}]},{id:"ov-ca-gl",kind:"ov",owners:["ca","dk"],name:"캐나다·덴마크가 함께 주장",lead:"엘즈미어섬·그린란드 북쪽, 로모노소프 해령이 시작되는 쪽 해저이다.",facts:[{h:"두 나라의 주장",text:"두 나라 모두 로모노소프 해령이 자기 나라 대륙에서 이어진다고 주장한다.",src:["sciNordic","ibru"]},{h:"200해리 안은 해결",text:"두 나라는 2022년 한스섬과 링컨해 등 200해리 안의 경계 문제를 합의로 해결하였다. 200해리 밖 겹치는 곳은 아직 남아 있다.",src:["hans","ibru"]},{h:"넓이",text:"지도 자료로 계산한 이 구역의 넓이는 약 10만 km²이다.",src:["mrEcs"]}]},{id:"ov-ca-us",kind:"ov",owners:["us","ca"],name:"미국·캐나다가 함께 주장(보퍼트해 북쪽)",lead:"보퍼트해 경계 분쟁이 200해리 밖 해저까지 이어진 곳이다.",facts:[{h:"미국의 주장",text:"2023. 12. 19. 발표한 대륙붕 바깥 한계에 이 해저를 넣었다.",src:["usdos"]},{h:"캐나다의 주장",text:"2019년 제출과 2022년 추가 제출에 이 해저를 넣었다.",src:["clcs","ibru"]},{h:"협상",text:"두 나라는 2024년 보퍼트해 경계와 겹치는 대륙붕을 함께 협상할 공동 작업단을 만들기로 하였다.",src:["hnn"]},{h:"자원 추정",text:"아메라시아 분지의 미발견 자원은 석유 약 97억 배럴, 천연가스 약 56.9조 세제곱피트로 추정되었다.",src:["usgs"]}]},{id:"ov-ca-ru-us",kind:"ov",owners:["us","ca","ru"],name:"미국·캐나다·러시아 주장이 겹치는 작은 구역",lead:"추크치 해저 고원 북쪽에서 세 나라 주장이 조금 겹치는 곳이다.",facts:[{h:"겹침",text:"캐나다 제출, 러시아(위원회 권고), 미국 발표 범위가 겹치는 약 8천 km²의 작은 구역으로 지도 자료에 나타난다.",src:["mrEcs"]},{h:"미국·러시아 사이",text:"미국은 대륙붕 바깥 한계의 기준점이 러시아와 합의한 경계선 서쪽에는 하나도 없다고 밝혔다.",src:["usdos","usru"]}]},{id:"ov-gl-no",kind:"ov",owners:["dk","no"],name:"덴마크·노르웨이 주장이 겹치는 작은 구역",lead:"그린란드 동쪽·북동쪽 바다 밑에서 두 나라 범위가 조금 겹치는 곳이다.",facts:[{h:"겹침",text:"덴마크(그린란드) 제출 범위와 노르웨이(스발바르 등)의 위원회 권고 범위가 겹치는 곳으로, 지도 자료에 약 1만 km²로 나타난다.",src:["mrEcs"]}]},{id:"dis-beaufort",kind:"dis",owners:["us","ca"],name:"보퍼트해 경계 분쟁(200해리 안)",lead:"알래스카와 캐나다 유콘 사이 바다에서 경계선을 어디에 그을지 두 나라 생각이 다르다.",facts:[{h:"캐나다의 주장",text:"1825년 러시아·영국 조약이 정한 서경 141° 선이 육지뿐 아니라 바다 경계도 된다고 주장한다.",src:["hnn"]},{h:"미국의 주장",text:"그 조약은 육지 경계만 정한 것이므로, 바다에서는 두 나라 해안에서 같은 거리에 있는 선(등거리선)을 경계로 해야 한다고 주장한다.",src:["hnn"]},{h:"협상",text:"2024년 두 나라는 공동 작업단을 만들어 협상하기로 하였다.",src:["hnn"]},{h:"넓이",text:"두 주장 사이에 낀 쐐기 모양 바다로, 지도 자료로 계산하면 약 2만 5천 km²이다.",src:["mrEez"]},{h:"자원",text:"알래스카 북쪽(알래스카 북극 지역)은 북극권에서 미발견 석유가 가장 많을 것으로 추정되는 곳이다(약 300억 배럴).",src:["usgs"]}]},{id:"ecs-ru",kind:"ecs",owners:["ru"],name:"러시아의 대륙붕 연장 주장",lead:"러시아 200해리 밖에서 러시아만 주장하는 해저이다.",facts:[{h:"제출 과정",text:"2001. 12. 20. 처음 제출 → 2002년 위원회가 자료 보완 권고 → 2015. 8. 3. 수정 제출 → 2021. 3. 31. 보충 자료 2건 → 2023. 2. 6. 위원회 권고.",src:["clcs","clcsRus"]},{h:"근거",text:"로모노소프 해령, 멘델레예프-알파 해령, 포드보드니코프 분지가 시베리아 대륙붕의 자연 연장이라고 주장한다.",src:["belfer"]},{h:"바렌츠해",text:"노르웨이와의 바렌츠해 경계는 2010년 조약으로 정해졌다.",src:["noru"]}]},{id:"ecs-gl",kind:"ecs",owners:["dk"],name:"덴마크(그린란드)의 대륙붕 연장 주장",lead:"그린란드 200해리 밖에서 덴마크만 주장하는 해저이다.",facts:[{h:"제출",text:"2014. 12. 15. 「그린란드 북쪽 대륙붕」 자료를 제출하였다.",src:["clcs"]},{h:"근거",text:"로모노소프 해령이 지형으로도 지질로도 그린란드 북쪽 대륙 주변부의 일부라고 주장한다.",src:["sciNordic"]}]},{id:"ecs-ca",kind:"ecs",owners:["ca"],name:"캐나다의 대륙붕 연장 주장",lead:"캐나다 200해리 밖에서 캐나다만 주장하는 해저이다.",facts:[{h:"제출",text:"2019. 5. 23. 북극해 자료를 제출하고 2022. 12.(IBRU 기준 12. 22.) 추가 자료를 내 범위를 넓혔다. 위원회 권고는 아직 나오지 않았다.",src:["clcs","ibru"]},{h:"근거",text:"북극 중앙 해저 고원 전체가 캐나다 대륙붕에서 이어진다고 주장한다.",src:["barentsCa"]}]},{id:"ecs-us",kind:"ecs",owners:["us"],name:"미국의 대륙붕 연장 주장",lead:"알래스카 200해리 밖에서 미국만 주장하는 해저이다.",facts:[{h:"발표",text:"2023. 12. 19. 국무부가 대륙붕 바깥 한계를 발표하였다. 전체 약 100만 km² 가운데 절반이 넘는 약 52만 km²가 알래스카 북쪽 북극해에 있다.",src:["usdos"]},{h:"근거",text:"유엔 해양법 협약에 가입하지 않아 위원회에 내지는 않았지만, 협약이 국제 관습법을 반영한다고 보고 그 기준에 따랐다고 밝혔다.",src:["usdos","hnn"]}]},{id:"ecs-no",kind:"ecs",owners:["no"],name:"노르웨이의 대륙붕(위원회 권고 받음)",lead:"노르웨이 200해리 밖에서 위원회 권고를 받은 해저이다.",facts:[{h:"제출과 권고",text:"2006. 11. 27. 북동 대서양·북극 자료를 제출하고, 2009. 3. 27. 위원회 권고를 받았다.",src:["clcs"]},{h:"범위",text:"권고를 받은 곳에는 스발바르 북쪽 난센 분지 서쪽, 바렌츠해 가운데의 「루프 홀」, 노르웨이해의 「바나나 홀
